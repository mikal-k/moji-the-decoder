<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moji the Decoder</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

    :root {
      --bg: #1f232b;
      --bg-soft: #2a2f39;
      --panel: #313744;
      --text: #e8edf5;
      --muted: #aab4c3;
      --accent: #8fb3ff;
      --border: #4a5364;
      --shadow: rgba(0,0,0,0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #2b3140 0%, var(--bg) 60%);
      color: var(--text);
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 2.5rem 1rem 4rem;
      text-align: center;
    }

    h1 {
      margin: 0;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Pacifico', cursive;
      font-weight: 400;
    }

    .robot {
      font-size: 3.2rem;
      margin-bottom: -0.2rem;
    }

    .terminator {
      position: relative;
      top: 0.15rem;
      font-size: 3rem;
      color: #cddcff;
      text-shadow: 2px 2px 0 #1b1f27;
      transform: rotate(-4deg) skew(-4deg);
    }

    .subline {
      margin: 0.5rem 0 1.5rem;
      color: var(--muted);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 1.4rem;
      padding: 1.5rem 1rem 2rem;
      box-shadow: 0 12px 30px var(--shadow);
    }

    .emoji-input {
      display: block;
      width: 6.8rem;
      height: 4.5rem;
      margin: 0 auto;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-soft);
      color: var(--text);
      font-size: 2.2rem;
      text-align: center;
      outline: none;
      transition: 0.15s;
    }

    .emoji-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(143,179,255,0.2);
    }

    .examples {
      margin-top: 1.5rem;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .example-btn {
      font-size: 1.8rem;
      padding: 0.4rem 0.7rem;
      border-radius: 0.8rem;
      border: none;
      cursor: pointer;
      background: #fff;
    }

    .result {
      margin-top: 2rem;
      display: none;
    }

    .result.show {
      display: block;
    }

    .big {
      font-size: 4rem;
    }

    .name {
      margin-top: 0.4rem;
      color: var(--muted);
      font-weight: 600;
    }

    .sequence {
      margin-top: 1.2rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.6rem;
    }

    .part {
      background: #fff;
      color: #000;
      padding: 0.6rem;
      border-radius: 0.8rem;
      min-width: 5.5rem;
    }

.connector {
  opacity: 0.72;
  font-size: 0.9rem;
  color: var(--muted);
  white-space: nowrap;
}
    .hex {
      margin-top: 1rem;
      font-family: monospace;
      opacity: 0.7;
    }

    .empty {
      margin-top: 1.5rem;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div class="wrap">

    <h1>
      <span class="robot">👁️‍🗨️🤖</span>
      <span class="terminator">Moji the Decoder</span>
    </h1>

    <div class="subline">Paste one emoji or click example</div>

    <div class="panel">

      <input id="input" class="emoji-input" maxlength="16">

      <div class="examples">
        <button class="example-btn">👨‍👩‍👧</button>
        <button class="example-btn">👨‍🚀</button>
        <button class="example-btn">🧑‍💻</button>
        <button class="example-btn">🏳️‍🌈</button>
        <button class="example-btn">❤️</button>
        <button class="example-btn">🤝🏽</button>
      </div>

      <div id="empty" class="empty">
        No inspection yet
      </div>

      <div id="result" class="result">
        <div id="big" class="big"></div>
        <div id="name" class="name"></div>
        <div id="sequence" class="sequence"></div>
        <div id="hex" class="hex"></div>
      </div>

    </div>
  </div>
<script>
  const input = document.getElementById("input");
  const result = document.getElementById("result");
  const empty = document.getElementById("empty");
  const big = document.getElementById("big");
  const name = document.getElementById("name");
  const sequence = document.getElementById("sequence");
  const hex = document.getElementById("hex");

  const names = {
    "🧑‍💻": "Technologist",
    "👨‍🚀": "Man Astronaut",
    "👨‍👩‍👧": "Family",
    "🏳️‍🌈": "Rainbow Flag",
    "❤️": "Red Heart",
    "🤝🏽": "Handshake"
  };

  function codepointHex(char) {
    return char.codePointAt(0).toString(16).toUpperCase().padStart(4, "0");
  }

  function decode(str) {
    const value = str.trim();

    if (!value) {
      result.classList.remove("show");
      empty.style.display = "block";
      big.textContent = "";
      name.textContent = "";
      sequence.innerHTML = "";
      hex.textContent = "";
      return;
    }

    empty.style.display = "none";
    result.classList.add("show");

    big.textContent = value;
    name.textContent = names[value] || "";

    const chars = Array.from(value);
    sequence.innerHTML = "";

    chars.forEach((c) => {
      const hexVal = codepointHex(c);

      if (hexVal === "200D") {
        const conn = document.createElement("div");
        conn.className = "connector";
        conn.title = "U+200D Zero Width Joiner";
        conn.textContent = "—ZWJ—";
        sequence.appendChild(conn);
        return;
      }

      if (hexVal === "FE0F") {
        const meta = document.createElement("div");
        meta.className = "connector";
        meta.title = "U+FE0F Variation Selector-16";
        meta.textContent = "(VS16)";
        sequence.appendChild(meta);
        return;
      }

      const part = document.createElement("div");
      part.className = "part";

      const glyph = document.createElement("div");
      glyph.style.fontSize = "2rem";
      glyph.style.lineHeight = "1.2";
      glyph.textContent = c;

      const code = document.createElement("div");
      code.style.marginTop = "0.35rem";
      code.style.fontSize = "0.8rem";
      code.style.opacity = "0.7";
      code.style.fontFamily = "monospace";
      code.textContent = "U+" + hexVal;

      part.appendChild(glyph);
      part.appendChild(code);
      sequence.appendChild(part);
    });

    hex.textContent = chars
      .map(c => "U+" + codepointHex(c))
      .join(" ");
  }

  input.addEventListener("input", () => decode(input.value));

  document.querySelectorAll(".example-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      input.value = btn.textContent;
      decode(input.value);
    });
  });

  decode("");
</script>
</body>
</html>
